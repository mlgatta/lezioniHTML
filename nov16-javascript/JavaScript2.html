<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>JavaScript #2</title>
</head>
<body>
	<script>
		let ore = 15;
		document.write("Sono le " + ore + ": "); //stampo il valore di ore tra due testi fissi
		
		if (ore <= 12) { // se ore è minore o uguale a 12...
			document.write("Buongiorno!"); // ... stampa "Buongiorno!"
		} else { // in tutti gli altri casi...
			document.write("Buonasera!"); // ... stampa "Buonasera!"
		}
	</script>
</body>
</html>

<!doctype html> 
<html> 
<head> 
	<meta charset="utf-8" /> 
	<title>Immagini in div</title>
	<link href="stile_div.css" rel="stylesheet" />
</head>
<body> 
	<div id="menu">Home | Chi siamo | Contatti | Link</div> <!-- menu che vogliamo fixare -->
	<br/><br/><br/> <!-- un div fixato è come se stesse su un altro livello, quindi il resto della pagina deve iniziare più in basso per non finire "sotto" il div fixato -->
	<div class="foto"><img src="1-stampante.jpg" class="prodotto" alt="Stampante" /></div>
	<div class="foto"><img src="2-scala.jpg" class="prodotto" alt="Scala" /></div>
	<div class="foto"><img src="3-telefono.png" class="prodotto" alt="Icona telefono" /></div>
</body>
</html>

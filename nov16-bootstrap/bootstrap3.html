<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<title>Esempio navbar di Bootstrap</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous"> <!-- collegamento al CSS di Boostrap online -->
	<style>
		body {
			background-color: brown;
		}
		
		.container {
			background-color: #ffff80;
		}
		
		.navbar {
			width: 100%;
			margin: 0px auto;
			padding: 16px;
		}
		
		.nav-link {
			color: white;
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg fixed-top p-2 bg-danger">
	<!-- navbar-expand-lg: breakpoint per passare alla modalità compatta, fixed-top blocca in alto -->
	<a class="navbar-brand" href="bootstrap3.html"><img src="logo-2.jpg" alt="Accademia del Levante" /></a>
	<!-- navbar-brand: formatta i loghi inseriti nella navbar -->
	<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mia_nav">
		<span class="navbar-toggler-icon"></span>
		<!--  navbar-toggler: comportamento del button, poi specificato come collapse; navbar-toggler-icon: disegna le tre linee orizzontali tipiche dei menù collassati in un button -->
	</button>
	<div class="collapse navbar-collapse justify-content-end" id="mia_nav">
	<!-- justify-content-end posiziona la navbar a destra con testi giustificati -->
		<ul class="navbar-nav">
			<li class="nav-item"><a class="nav-link" href="#">Chi siamo</a></li>
			<li class="nav-item"><a class="nav-link" href="#">Corsi</a></li>
			<li class="nav-item"><a class="nav-link" href="#">Certificazioni</a></li>
			<li class="nav-item"><a class="nav-link" href="#">Contatti</a></li>
			<li class="nav-item"><a class="nav-link" href="#">Lavora con noi</a></li>
		</ul>
	</div>
	</nav>

</body>
</html>
